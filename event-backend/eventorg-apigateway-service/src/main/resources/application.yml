spring:
  application:
    name: eventorg-apigateway-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
      mvc:
        default-filters:
          - ResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
        routes:
          - id: eventorg-event-service
            uri: lb://eventorg-event-service
            predicates:
              - Path=/api/events/**
          - id: eventorg-guest-service
            uri: lb://eventorg-guest-service
            predicates:
              - Path=/api/guest/**
          - id: eventorg-vendor-service
            uri: lb://eventorg-vendor-service
            predicates:
              - Path=/api/vendors/**
          - id: eventorg-task-service
            uri: lb://eventorg-task-service
            predicates:
              - Path=/api/task/**

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true